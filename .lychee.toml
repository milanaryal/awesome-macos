accept = ["200..=299", "403", "429"]
accept_timeouts = true
max_concurrency = 12
max_redirects = 10
max_retries = 2
method = "get"
no_progress = true
timeout = 20
user_agent = "Mozilla/5.0 (compatible; awesome-macos-link-check/1.0)"

exclude = [
  '^https://apps\.apple\.com/',
  '^https://img\.shields\.io/',
  '^https://inkscape\.org/',
  '^https://unsplash\.com/',
]
